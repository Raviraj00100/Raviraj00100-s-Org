<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1E1638"/>
      <stop offset="60%" stop-color="#100D20"/>
      <stop offset="100%" stop-color="#090714"/>
    </radialGradient>
    <linearGradient id="sphereGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="40%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="127" stroke="rgba(167, 139, 250, 0.25)" stroke-width="2"/>
  <!-- Outer Glow Orbit -->
  <circle cx="256" cy="256" r="160" stroke="url(#sphereGrad)" stroke-width="6" stroke-opacity="0.4" stroke-dasharray="16 12"/>
  <!-- Central Sphere -->
  <circle cx="256" cy="256" r="120" fill="url(#sphereGrad)" filter="url(#glow)"/>
  <!-- Inner Highlight -->
  <circle cx="220" cy="220" r="40" fill="white" fill-opacity="0.25"/>
  <!-- Verified Checkmark -->
  <path d="M200 256 L240 296 L316 216" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
